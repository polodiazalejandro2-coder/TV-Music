<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify BAMBA</title>
    <link rel="stylesheet" href="styles.css">
    <script type="importmap">
        {
            "imports": {
                "three": "../tv/js/threejs/three.module.js",
                "three/addons/": "../tv/js/threejs/jsm/"
            }
        }
    </script>
    <script src="../tv/js/color-thief.umd.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.2.4/howler.min.js" defer></script>
    <script type="module" src="scripts.js"></script>
</head>

<body>
    <div id="three-background" aria-hidden="true"></div>

    <main class="app-container">
        <section class="content-body" aria-label="Playlist">
            <div class="playlist-heading">
                <span class="eyebrow">SONIDO EN ROTACIÓN</span>
                <h2>Tu colección</h2>
            </div>
            <div id="songs-container" class="songs-grid"></div>
        </section>

        <div class="player-controls-center" aria-label="Controles del reproductor">
            <div class="player-transport">
                <div class="control-buttons">
                    <button id="shuffle-btn" type="button" aria-label="Aleatorio" aria-pressed="false">⤨</button>
                    <button id="prev-btn" type="button" aria-label="Anterior">‹</button>
                    <button id="play-pause-btn" type="button" class="main-play" aria-label="Reproducir">▶</button>
                    <button id="next-btn" type="button" aria-label="Siguiente">›</button>
                    <button id="repeat-btn" type="button" aria-label="Repetir" aria-pressed="false">↻</button>
                </div>

                <div class="volume-control">
                    <span aria-hidden="true">♪</span>
                    <input type="range" id="volume-bar" value="80" min="0" max="100" aria-label="Volumen">
                </div>
            </div>

            <div class="progress-container">
                <span id="current-time">0:00</span>
                <input type="range" id="progress-bar" value="0" min="0" max="1000" aria-label="Posición de reproducción">
                <span id="total-duration">0:00</span>
            </div>
        </div>
    </main>
</body>

</html>
